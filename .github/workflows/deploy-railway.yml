name: Deploy to Railway

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gst_payment_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint || true

      - name: Run tests
        run: npm test || true
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gst_payment_test
          JWT_SECRET: test-secret-key
          RAZORPAY_KEY: test-key
          RAZORPAY_SECRET: test-secret

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v3

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Notify deployment
        if: success()
        run: echo "✅ Deployment successful! App is live at https://gst-payment-poc.railway.app"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deployment failed. Check logs in Railway dashboard"

  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Wait for app to be ready
        run: sleep 30

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl -f https://gst-payment-poc.railway.app/health; then
              echo "✅ App is healthy"
              exit 0
            fi
            echo "Waiting for app to respond... (attempt $i/10)"
            sleep 5
          done
          echo "❌ App failed health check"
          exit 1
