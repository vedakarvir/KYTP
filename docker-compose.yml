version: '3.8'

services:
  # Node.js Backend
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gst-payment-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://gst_user:postgres@db:5432/gst_payment_db
      JWT_SECRET: dev-secret-key-change-in-production
      RAZORPAY_KEY: rzp_test_xxxxxxxxxxxxxxxx
      RAZORPAY_SECRET: xxxxxxxxxxxxxxxx
      GOOGLE_CLOUD_KEY_PATH: ./google-cloud-key.json
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173
      LOG_LEVEL: debug
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - ./google-cloud-key.json:/app/google-cloud-key.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # PostgreSQL Database
  db:
    image: postgres:13-alpine
    container_name: gst-payment-db
    environment:
      POSTGRES_USER: gst_user
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gst_payment_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gst_user -d gst_payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (Database GUI - Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gst-payment-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gstpayment.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

  # Redis (Optional - for caching)
  redis:
    image: redis:7-alpine
    container_name: gst-payment-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: gst-payment-network
    driver: bridge
